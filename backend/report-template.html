<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        h3 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #4f81bd;
            color: white;
            padding: 10px;
            border: 1px solid #ccc;
        }

        td {
            padding: 10px;
            border: 1px solid #ccc;
        }

        tr:nth-child(even) {
            background: #f5f5f5;
        }
    </style>
</head>

<body>

    <h1>Daily Work Report</h1>

    <h3>Date : {{DATE}}</h3>

    <table>

        <tr>
            <th>Project</th>
            <th>Task</th>
            <th>Duration</th>
        </tr>

        {{ROWS}}

    </table>

</body>

</html>
